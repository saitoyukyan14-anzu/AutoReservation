name: Scrape availability

on:
  schedule:
    # 1日2回 JST 10:00 / 22:00（= UTC 01:00 / 13:00）
    - cron: "0 1 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      months:
        description: "取得範囲（今日からNヶ月先の末日まで）"
        default: "2"

permissions:
  contents: write # data/*.json をコミットするため
  pages: write
  id-token: write

# 実行が重ならないようにする（前回の実行中に次の定期実行が来たら待たせる）
concurrency:
  group: scrape
  cancel-in-progress: false

env:
  # 取得の時間予算（分）。これを過ぎたスクレイパーは、そこまでの取得分で打ち切って part を書き出す。
  # scrape ジョブの timeout-minutes（350）から、セットアップ（依存インストール）と
  # 書き出し・アップロードの時間を引いた値にすること。
  TIME_BUDGET_MIN: "330"

jobs:
  # 「区 × shard」ごとに1ジョブで並列取得（各ジョブが part ファイルを1つ生成）
  scrape:
    name: scrape ${{ matrix.ward }} [${{ matrix.shard }}] (${{ matrix.shards }}分割)
    runs-on: ubuntu-latest
    # GitHub Actions の1ジョブ上限は6時間。強制終了されると結果が全損するので手前で止める
    # （スクレイパー側も TIME_BUDGET_MIN で自主的に打ち切る）。
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # ── 区を追加するときは、ここに行を追加する ────────────────────────────
        #   ward:   区キー（scraper/scrapers/<区>.py のクラスの `key`）
        #   shards: その区の分割数（supports_shard=False のスクレイパーは必ず 1）
        #   shard:  0 〜 shards-1 を「すべて」1行ずつ並べる（欠けた shard の施設は前回データで補われ、更新されない）
        # 例) 港区を分割なしで追加する場合:
        #   - { ward: minato, shards: 1, shard: 0 }
        # 例) 新宿区を2分割で追加する場合:
        #   - { ward: shinjuku, shards: 2, shard: 0 }
        #   - { ward: shinjuku, shards: 2, shard: 1 }
        include:
          # 世田谷区（5分割）
          - { ward: setagaya, shards: 5, shard: 0 }
          - { ward: setagaya, shards: 5, shard: 1 }
          - { ward: setagaya, shards: 5, shard: 2 }
          - { ward: setagaya, shards: 5, shard: 3 }
          - { ward: setagaya, shards: 5, shard: 4 }
          # 新宿区（分割なし。HTTP クライアント方式・1セッションで順番に取得。所要 約25分）
          - { ward: shinjuku, shards: 1, shard: 0 }
          # 文京区（分割なし）。robots.txt が Disallow: /* のため、ユーザー承認の控えめな条件で運用する:
          # 並列1本（shards は必ず 1。スクレイパーも分割に対応させていない）・操作ごとに3秒以上待機・
          # 1セッション3施設×2週間表示まで。所要は約40〜45分の見込み（実測から。リクエスト数の上限については README 参照）。
          - { ward: bunkyo, shards: 1, shard: 0 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: scraper
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run scraper (${{ matrix.ward }} shard ${{ matrix.shard }}/${{ matrix.shards }})
        env:
          MONTHS: ${{ github.event.inputs.months || '2' }}
        run: >-
          python scraper/main.py
          --ward "${{ matrix.ward }}"
          --months "$MONTHS"
          --shard-index ${{ matrix.shard }}
          --shard-count ${{ matrix.shards }}
          --time-budget-min "$TIME_BUDGET_MIN"
      - uses: actions/upload-artifact@v4
        with:
          name: avail-part-${{ matrix.ward }}-${{ matrix.shard }}
          path: web/public/data/availability.part.${{ matrix.ward }}.${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  # 全 part を結合し、コミット
  combine:
    needs: scrape
    # 一部の区・shard が失敗・時間切れでも結合する（欠けた区・shard の施設や、時間切れで取れなかった
    # 日付は既存の availability.json から補う。詳細は README）。ワークフロー自体がキャンセルされた場合は結合しない。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (no browser needed)
        run: pip install -r scraper/requirements.txt
      - name: Download part files
        uses: actions/download-artifact@v4
        with:
          pattern: avail-part-*
          merge-multiple: true
          path: web/public/data
      - name: Combine into availability.json
        run: python scraper/main.py --combine
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/availability.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "data: update availability ($(date -u +%Y-%m-%dT%H:%MZ))"
            # 取得中（最大約6時間）に main が進んでいても push できるよう、最新に載せ直す
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

  # サイトを再ビルド・公開
  deploy:
    needs: combine
    # scrape の一部が失敗していても、combine が成功していれば公開する
    # （既定の success() は scrape の失敗まで遡って見るため、明示的に条件を書く）
    if: ${{ !cancelled() && needs.combine.result == 'success' }}
    uses: ./.github/workflows/deploy.yml
